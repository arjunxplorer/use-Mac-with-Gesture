[project]
name = "gesturemac"
version = "0.1.0"
description = "Local macOS menu-bar app: hand gestures control cursor, clicks, and scroll"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pyobjc-framework-avfoundation>=10.0",
    "pyobjc-framework-applicationservices>=10.0",
    "rumps>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
gesturemac = "gesturemac.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesturemac"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
